<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlphaSchool Articles</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- Header -->
    <div class="header">
       <div class="left-section">
           <p class="logo">🏫<span>Alpha</span>School</p>
       </div>
       <div class="right-section">
         <button>🏠 Home</button>
         <button>📚 Articles</button>
         <button>🎉 Events</button>
         <button>📞 Contacts</button>
       </div>
    </div>

    <!-- Category Title -->
    <div class="categorie">
        <h1 id="pageTitle">Category</h1>
    </div>

    <!-- Articles Container -->
    <div class="card" id="articlesContainer">
        <!-- JS will insert cards here -->
    </div>

    <!-- Other Categories -->
    <div class="card-categories">
        <h2>Explore Other Categories</h2>
        <div class="all-categories">

            <div class="categorie-card" data-category="art">
                <span class="icon">🎨</span>
                <p>Art</p>
            </div>

            <div class="categorie-card" data-category="scientific clubs">
                <span class="icon">🧪</span>
                <p>Science Clubs</p>
            </div>
            
            <div class="categorie-card" data-category="school trip">
                <span class="icon">🚌</span>
                <p>Sortie Scolaire</p>
            </div>

            <div class="categorie-card" data-category="competition">
                <span class="icon">🏆</span>
                <p>Competition</p>
            </div>

            <div class="categorie-card" data-category="education">
                <span class="icon">📘</span>
                <p>Education</p>
            </div>

            <div class="categorie-card" data-category="sport">
                <span class="icon">⚽</span>
                <p>Sport</p>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="footer-box">
            <h3>🏫<span>Alpha</span>School</h3>
            <p>Empowering students through knowledge and activities</p>
        </div>

        <div class="footer-box">
            <h4>Quick Links</h4>
            <a class="href" href="#">Home</a>
            <a class="href" href="#">Articles</a>
            <a class="href" href="#">Events</a>
            <a class="href" href="#">Contact</a>
        </div>

        <p class="copyright">© 2025 School Portal. All rights reserved.</p>
    </footer>

  <!-- JS -->
  <script src="script.js"></script>

</body>
</html>
